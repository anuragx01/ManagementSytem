spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  redis:
    host: localhost
    port: 6379
  data:
    redis:
      repositories:
        enabled: false

app:
  jwt:
    secret: test-secret-key-that-is-at-least-32-characters-long-for-hs256
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  cors:
    allowed-origins: http://localhost:3000
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  aws:
    access-key: test-key
    secret-key: test-secret
    region: us-east-1
    s3-bucket: test-bucket
  mail:
    from: noreply@test.com
    from-name: Test Portal
  password-reset:
    token-expiry-minutes: 30
  email-verification:
    token-expiry-hours: 24
  pagination:
    default-page-size: 20
    max-page-size: 100
