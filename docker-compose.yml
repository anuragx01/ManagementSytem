version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    container_name: nexstar_postgres
    environment:
      POSTGRES_DB: nexstar_db
      POSTGRES_USER: nexstar
      POSTGRES_PASSWORD: nexstar123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexstar -d nexstar_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexstar_network

  redis:
    image: redis:7-alpine
    container_name: nexstar_redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexstar_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexstar_backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/nexstar_db
      DB_USERNAME: nexstar
      DB_PASSWORD: nexstar123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: nexstar-super-secret-key-must-be-at-least-256-bits-long-for-HS256
      JWT_ACCESS_EXPIRY: 900000
      JWT_REFRESH_EXPIRY: 604800000
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexstar_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  nexstar_network:
    driver: bridge
